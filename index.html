<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sounding Home: an interactive digital sound archive</title>
<meta name="description" content="Drag field recordings into a hand-drawn house. Position sets volume and reverb. Download your soundscape as a WAV and a JSON note.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <header class="site-head">
    <h1 class="site-title">
      <img class="title-house-icon" src="assets/house.png" alt="">
      Sounding Home
    </h1>
    <p class="tagline">an interactive digital sound archive</p>
  </header>

  <p class="intro-text">insert text here</p>

  <div id="tapPrompt" class="tap-prompt" hidden>
    <button class="stamp-btn" id="tapPromptBtn">tap to listen</button>
  </div>

  <!-- ARCHIVE -->
  <section aria-label="Sound archive">
    <h2>Archive</h2>
    <div id="archiveList" class="archive-list"></div>
  </section>

  <!-- POCKET BUILDING -->
  <section aria-label="Mixing house">
    <h2>Pocket Building</h2>
    <p class="section-text">drag a sound into the house - max. 3</p>

    <div class="house-panel">
      <div class="house-svg-wrap" id="houseWrap">
        <img class="house" src="assets/house.png" alt="a hand-drawn house" draggable="false">
        <div class="dropzone" id="dropzone" style="left:14%; right:16%; top:20%; bottom:11%;"></div>
      </div>
    </div>
    <p class="slots" id="slotStatus">0 / 3 sounds placed</p>
  </section>

  <!-- FEEL(D) NOTES -->
  <section aria-label="Describe and export">
    <h2>Feel(d) Notes</h2>
    <label for="description">What do you hear? What do you feel? What imaginary world reveals itself? Describe your soundscape composition</label>
    <textarea id="description" placeholder="…"></textarea>

    <div class="mix-readout" id="mixReadout"></div>

    <div class="controls">
      <button class="stamp-btn" id="downloadBtn" disabled>download composition</button>
    </div>
    <p class="status-line" id="statusLine"></p>
  </section>

  <footer class="site-foot">
    <span>Sounding Home — open source, static, no backend, no tracking.</span>
    <span><a href="https://github.com/" target="_blank" rel="noopener">source on GitHub</a> · MIT licensed</span>
  </footer>

</div>

<script src="js/wav-encoder.js"></script>
<script src="js/zip-encoder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
